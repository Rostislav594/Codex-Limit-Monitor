name: Build and publish release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
      - scripts/Publish-Portable.ps1
      - scripts/Build-Installer.ps1
      - installer/**
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = (Get-Content -LiteralPath .\VERSION -Raw).Trim()
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        shell: pwsh
        run: dotnet restore .\CodexLimitMonitor.sln

      - name: Test
        shell: pwsh
        run: dotnet test .\CodexLimitMonitor.sln -c Release --no-restore

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build portable package and installer
        shell: pwsh
        run: .\scripts\Build-Installer.ps1 -Version $env:VERSION

      - name: Verify release files
        shell: pwsh
        run: |
          $files = @(
            ".\artifacts\release\CodexLimitMonitor-$env:VERSION-win-x64.zip",
            ".\artifacts\release\CodexLimitMonitor-$env:VERSION-win-x64.zip.sha256",
            ".\artifacts\installer\CodexLimitMonitor-$env:VERSION-win-x64-setup.exe",
            ".\artifacts\installer\CodexLimitMonitor-$env:VERSION-win-x64-setup.exe.sha256"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing release asset: $file"
            }
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $assets = @(
            ".\artifacts\release\CodexLimitMonitor-$env:VERSION-win-x64.zip",
            ".\artifacts\release\CodexLimitMonitor-$env:VERSION-win-x64.zip.sha256",
            ".\artifacts\installer\CodexLimitMonitor-$env:VERSION-win-x64-setup.exe",
            ".\artifacts\installer\CodexLimitMonitor-$env:VERSION-win-x64-setup.exe.sha256"
          )

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            gh release create $tag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Codex Limit Monitor $env:VERSION" `
              --notes "Windows x64 release. Download CodexLimitMonitor-$env:VERSION-win-x64-setup.exe for normal installation, or the ZIP for portable use. SHA-256 checksum files are included."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
